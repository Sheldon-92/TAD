    changelog_text: "## Security\n\nFour security vulnerabilities have been identified, and fixed, in this release. Users are advised to update gh to version `v2.102.0` as soon as possible.\n\n`gh release download`, `gh run download`, `gh repo read-file --output`, and `gh attestation download` could write remote content to an unintended local file when the destination contained symbolic links.\n\nSee https://github.com/cli/cli/security/advisories/GHSA-39wj-f2f4-978v for more information.\n\n`gh attestation verify` compared the `--source-ref` value case-insensitively, so an attestation built from a branch whose name differs only in case could satisfy a policy that named a different branch.\n\nSee https://github.com/cli/cli/security/advisories/GHSA-4mq3-hpgx-9cx8 for more information.\n\nInteractive `gh skill search` passed repository paths from search results to `gh skill install` without an option separator, so a search result could inject installer options and change where skill files were written.\n\nSee https://github.com/cli/cli/security/advisories/GHSA-qcwj-mr2r-2cx7 for more information.\n\n`gh attestation verify` matched the `--signer-workflow` value against only the start of the signing certificate's identity, so an attestation signed by a different workflow in the pinned repository could pass verification when its path began with the pinned value.\n\nSee https://github.com/cli/cli/security/advisories/GHSA-wjmr-j3rp-mh2g for more information.\n\n## What's Changed\n\n### \U0001F41B Fixes\n\n* Allow `ghu_` tokens for supported actors to attach files by @BagToad in [#14516](https://github.com/cli/cli/pull/14516)\n* Allow repo set-default --unset without an argument by @williammartin in [#14540](https://github.com/cli/cli/pull/14540)\n\n### \U0001F4DA Docs & Chores\n\n* Prioritize HackerOne for vulnerability reports by @BagToad in [#14497](https://github.com/cli/cli/pull/14497)\n* Clarify reviewer-facing PR guidance by @williammartin in [#14509](https://github.com/cli/cli/pull/14509)\n* Add a skill for chaptered CLI recordings by \n[... truncated, full text at https://github.com/cli/cli/releases]"
