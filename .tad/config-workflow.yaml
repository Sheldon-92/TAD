# TAD Config Module: Workflow & Document Management
# Part of TAD config.yaml modular split (v2.2)
# Contains: document_management, tad_maintain, requirement_clarification (pointer),
#           scenarios
# Consumers: tad-alex.md, tad-maintain.md, tad-handoff.md, tad-scenario.md
# ==================== 文档管理系统 ====================
document_management:
  manifest_file: .tad/manifest.yaml
  naming_convention:
    format: "{timestamp}_{version}_{task_id}_{type}_{status}.md"
    example: "20250128_1430_v1.2_TASK001_design_draft.md"

  structure:
    active:           # 当前活跃任务
      - tasks         # 任务追踪
      - designs       # 设计文档
      - handoffs      # 交接文档
      - epics         # Epic 多阶段任务追踪
      - playground    # Frontend Design Playground 预览
    archive:          # 已完成归档
      - by_date       # 按日期
      - by_task       # 按任务
      - by_version    # 按版本
      - epics         # 已完成的 Epic
      - playground    # 已归档的 Playground 文件
    context: "项目长期信息"
    working: "工作中文档"

  version_control:
    enabled: true
    auto_increment: true
    hash_verification: true
    change_tracking: true

  mandatory_sections:
    header:
      - task_id: "TASK-{YYYY}{MM}{DD}-{seq}"
      - version: "v{major}.{minor}.{patch}"
      - status: "draft|review|approved|implemented|archived"
      - owner: "{agent_name}"
      - created: "{timestamp}"
      - modified: "{timestamp}"
      - previous_version: "{link_to_previous}"

    metadata:
      - hash: "{file_hash}"
      - modified_by: "{agent_name}"
      - change_summary: "{summary}"

  # Handoff 生命周期管理 (检测跨 slug 替代和过期 handoff)
  handoff_lifecycle:
    stale_age_days: 7                    # Active handoff 超过此天数未完成 → 标记 POTENTIALLY_STALE
    cross_reference_window_days: 30      # 扫描 archive 中近 N 天的 handoff 进行主题匹配
    topic_match_threshold: 2             # 标题/摘要中至少 N 个关键词重叠才判定为主题替代
    common_words_exclude:                # 主题匹配时排除的通用词
      - "tad"
      - "implementation"
      - "design"
      - "handoff"
      - "update"
      - "fix"
      - "feature"

  # NEXT.md 维护规则 (防止文档无限增长)
  next_md_maintenance:
    description: "NEXT.md 是项目任务追踪文件，需要定期清理以保持可读性"

    size_limits:
      max_lines: 500
      max_tokens: 20000  # 保持在 Claude 可一次读取的范围内
      warning_threshold: 400  # 超过此行数时提醒清理

    archive_rules:
      # 归档触发条件（满足任一即触发）
      triggers:
        - "文件超过 500 行"
        - "读取时出现 token 超限错误"
        - "开始新的工作周"
        - "用户明确要求"

      # 归档目标
      destinations:
        completed_tasks: "docs/HISTORY.md"      # 已完成任务的历史记录
        milestones: "CHANGELOG.md"              # 重大里程碑
        technical_details: "docs/"              # 详细技术说明

      # 保留内容
      keep_in_next_md:
        - "当前进行中的任务"
        - "本周待办任务"
        - "Blocked 任务"
        - "最近 3 天的重要更新"

    history_md_format: |
      # Project History

      ## Week of YYYY-MM-DD
      ### Completed
      - [x] Task 1 (date)
      - [x] Task 2 (date)

      ### Key Decisions
      - Decision 1: reason

      ### Lessons Learned
      - Learning 1

    cleanup_steps:
      - step: 1
        action: "识别超过 7 天的已完成任务"
      - step: 2
        action: "将历史内容移动到 docs/HISTORY.md"
      - step: 3
        action: "保留当前进行中和本周待办任务"
      - step: 4
        action: "更新 NEXT.md 头部的日期和状态"
      - step: 5
        action: "验证文件行数在 500 行以内"

    agent_responsibility:
      alex: "发现 NEXT.md 过大时，规划清理方案"
      blake: "执行清理，移动内容到归档文件"

  # Epic 生命周期管理 (多阶段任务追踪)
  epic_lifecycle:
    enabled: true
    version: "1.0"
    description: "Epic is a container above handoffs for tracking multi-phase tasks"

    locations:
      active: ".tad/active/epics/"
      archive: ".tad/archive/epics/"
      template: ".tad/templates/epic-template.md"

    naming_convention:
      format: "EPIC-{YYYYMMDD}-{slug}.md"
      example: "EPIC-20260201-auth-system.md"

    constraints:
      max_active_epics: 3                    # Maximum concurrent active Epics
      sequential_constraint: true            # Only 1 Active phase per Epic at a time
      stale_age_days: 7                      # Active phase stuck for >N days triggers warning

    phase_statuses:
      planned: "⬚ Planned"
      active: "🔄 Active"
      done: "✅ Done"

    derived_status:
      planning: "All phases are ⬚ Planned"
      in_progress: "Any phase is 🔄 Active or ✅ Done"
      complete: "All phases are ✅ Done"

    phase_adjustment:
      add_phase: "Alex appends new row to Phase Map (⬚ Planned), notes reason"
      remove_phase: "Only ⬚ Planned phases can be removed, notes reason"
      reorder_phase: "Only ⬚ Planned phases can be reordered"

    error_handling:
      epic_file_missing: "WARNING, continue *accept (don't block handoff archive)"
      epic_format_invalid: "WARNING, skip update, remind user to fix"
      handoff_ref_mismatch: "WARNING, prompt user to confirm correct phase"
      concurrent_active_violation: "BLOCK, don't activate new phase"

    health_checks:
      - "STALE: All phases done but Epic not archived"
      - "ORPHAN: No linked handoffs and older than stale_age_days"
      - "DANGLING_REF: Phase Map references non-existent handoff"
      - "BACK_REF_MISMATCH: Handoff references Epic but Epic doesn't list it"
      - "STUCK: Active phase exceeds stale_age_days"
      - "OVER_ACTIVE: Multiple Active phases in same Epic"

# ==================== Drift Detection (Phase 1 P1.2, 2026-04-24) ====================
# Configuration for .tad/hooks/lib/drift-check.sh — 4 subchecks detecting handoff
# lifecycle drift. Called by /tad-maintain CHECK mode.
# Smoke alarm only: produces reports + suggestions, never auto-modifies files.
drift_check:
  enabled: true
  version: "1.0"

  # P1.2.b — zombie detection window
  # How far back git log is scanned for implementing commits. 60 days covers
  # typical Epic duration + paused-handoff drift without pulling all history.
  zombie_window_days: 60

  # P1.2.d — ghost task prefix list
  # Slugs matching `^(prefix1|prefix2|...)-` trigger grounded_state requirement.
  # Rationale: housekeeping/audit/sync handoffs commonly cite stale repo state
  # (toy 2026-04-24: 3 handoffs in 4 days flagged for this).
  ghost_task_prefixes:
    - housekeeping
    - sync
    - rsync
    - cleanup
    - maintenance
    - audit
    - refresh

# ==================== Document Maintenance Command ====================
tad_maintain:
  description: "Document health check and synchronization"
  command_file: ".agents/skills/tad-maintain/SKILL.md"
  modes:
    check:
      description: "Read-only health scan"
      triggers: ["agent_activation", "exit_command"]
    sync:
      description: "Scoped write operations"
      triggers: ["accept_command"]
    full:
      description: "Comprehensive check + sync"
      triggers: ["manual"]
  auto_archive_criteria:
    - "matching_completion_report"
    - "superseded_by_newer_version"
    - "epic_all_phases_complete"
  safety:
    write_strategy: "copy-then-delete"
    idempotent: true
    name_conflict_resolution: "append-timestamp-suffix"

# ==================== 配对测试协议 ====================
pair_testing:
  description: "Cross-tool E2E pair testing protocol with multi-session support"
  ownership: "Alex generates brief, human decides, Codex + Playwright executes with human"
  methodology: "4D Protocol (Discover→Discuss→Decide→Deliver)"
  base_dir: ".tad/pair-testing/"
  version: "2.1"

  # Multi-session management
  sessions:
    manifest: ".tad/pair-testing/SESSIONS.yaml"
    directory_pattern: ".tad/pair-testing/S{NN}/"
    max_active_sessions: 1        # Only 1 session can be "active" at a time
    session_id_format: "S{NN}"    # S01, S02, ..., S99, then S100+ (no padding beyond 99)
    context_inheritance: true      # New sessions auto-inherit previous findings

  brief:
    template: ".tad/templates/test-brief-template.md"
    output: ".tad/pair-testing/{session_id}/TEST_BRIEF.md"
    trigger: "Gate 4 pass (Alex evaluates, recommends to human, human decides)"
    sections:
      alex_fills: [1, 2, 3, 4, "4b", 5, 8]  # all content sections including session context
      template_default: [6, 7]                 # collaboration guide & output format

    skip_criteria:
      - "Backend-only changes (no UI impact)"
      - "Configuration/environment changes"
      - "Documentation-only updates"
      - "Internal refactoring with no user-facing behavior change"
      - "Dependency updates with no feature change"

  report:
    template: ".tad/templates/pair-test-report-template.md"
    expected_pattern: ".tad/pair-testing/S*/PAIR_TEST_REPORT.md"
    location: ".tad/pair-testing/{session_id}/"
    archive_to: ".tad/evidence/pair-tests/{date}-{session_id}-{slug}/"
    auto_detect_on_alex_start: true
    issue_routing:
      P0: "Create immediate handoff"
      P1: "Create handoff"
      P2: "Add to NEXT.md"

  screenshot:
    output_dir: ".tad/pair-testing/{session_id}/screenshots/"
    naming: "R{N}-{NN}-{description}.png"

# ==================== Frontend Design Playground v2 ====================
playground:
  enabled: true
  deprecated: true
  deprecated_since: "2.28.0"
  migration: "Use Feedback Collector (handoff §8.5 feedback_required: true). Blake generates overlay feedback HTML."
  version: "2.0"
  description: "DEPRECATED — Independent /playground command — replaced by Feedback Collector (2026-06-10)"
  ownership: "Independent Design Explorer agent. Alex references outputs, Blake implements from spec."

  # Command definition
  # command 于 v3.0.0 移除：playground 自 2.28.0 deprecated，skill 路径在 HEAD 前已不存在（悬空引用）

  # Core resources
  resources:
    style_library: ".tad/references/design-styles.yaml"
    gallery_template: ".tad/templates/gallery-template.html"
    design_tokens_template: ".tad/templates/design-tokens-template.md"

  # Directory structure
  directories:
    active: ".tad/active/playground/"
    archive: ".tad/archive/playground/"
    naming: "PLAYGROUND-{YYYYMMDD}-{project-slug}/"

  # Workflow
  workflow:
    steps: ["understand", "discover", "generate", "feedback", "iterate", "finalize"]
    versions_per_round: 3
    max_versions: 30
    feedback_mode: "mixed"  # structured + open discussion

  # Style library
  style_library:
    total_styles: 32
    categories: 7
    category_list: ["classic", "modern_ui", "minimal", "retro", "expressive", "trending", "futuristic"]

  # Output
  output:
    design_spec: "DESIGN-SPEC.md"
    persist_to: ".tad/project-knowledge/frontend-design.md"

  # State management
  state:
    file: "playground-state.json"
    backup: "playground-state.backup.json"
    atomic_writes: true

  # Cleanup
  cleanup:
    archive_on_accept: true
    keep_spec: true
    delete_html_after_archive: false

  # Legacy (archived)
  legacy_v1:
    archive_location: ".tad/archive/playground/legacy-v1/"
    archived_files:
      - "design-curations.yaml"
      - "playground-template.html"
      - "playground-guide.md"

# ==================== Requirement clarification (EPIC-20261019) ====================
# Replaces the legacy elicitation blocks.
requirement_clarification:
  reference: ".agents/skills/cora/references/requirement-clarification.md"
  tables: ".agents/skills/cora/references/decomposition-tables.md"

# ==================== Intent Modes (v2.4) ====================
intent_modes:
  enabled: true
  version: "1.0"
  description: "Alex multi-mode routing — detect user intent before entering workflow"

  modes:
    bug:
      command: "*bug"
      label: "Bug/Fix"
      icon: "🔧"
      description: "Quick bug diagnosis and optional fix"
      signal_words:
        zh: ["bug", "报错", "出问题", "崩溃", "修复", "不工作", "出错", "异常", "失败"]
        en: ["bug", "error", "broken", "crash", "fix", "not working", "fail", "issue"]
      leads_to_handoff: "optional"

    discuss:
      command: "*discuss"
      label: "Discussion"
      icon: "💬"
      description: "Free-form product/tech discussion, no handoff pressure"
      signal_words:
        zh: ["讨论", "聊聊", "怎么看", "方向", "策略", "纠结", "不确定", "想法", "觉得"]
        en: ["discuss", "think about", "direction", "strategy", "opinion", "uncertain"]
      leads_to_handoff: "never"

    idea:
      command: "*idea"
      label: "Idea Capture"
      icon: "💡"
      description: "Capture and refine ideas for later"
      signal_words:
        zh: ["突然想到", "有个想法", "能不能加", "以后可以", "要不要做", "灵感"]
        en: ["idea", "maybe", "what if", "could we", "someday", "nice to have"]
      leads_to_handoff: "never"

    learn:
      command: "*learn"
      label: "Learn"
      icon: "📚"
      description: "Socratic teaching — understand concepts through guided questions"
      signal_words:
        zh: ["学习", "教我", "为什么", "怎么理解", "原理", "解释一下", "什么意思", "学一下"]
        en: ["learn", "teach me", "why", "explain", "how does", "understand", "what is", "concept"]
      leads_to_handoff: "never"

    # Phase 3 P3.1 (2026-04-24): *express trivial-handoff path
    express:
      command: "*express"
      label: "Express"
      icon: "⚡"
      description: "Quick path for trivial bugfix / small UX polish (≤3 files). Skips ceremony, keeps ≥1 review."
      # ⚠️ Intentionally empty signal_words — Alex MUST NOT auto-detect *express
      # (per express_path_protocol.trigger.NOT_via_alex_suggestion).
      # User must type *express explicitly. Listed here so step1 explicit-command
      # bypass recognizes the keyword.
      signal_words:
        zh: []
        en: []
      leads_to_handoff: "always"
      user_explicit_only: true

    # Phase 3 P3.2 (2026-04-24): *experiment OPRO/A-B/benchmark path
    experiment:
      command: "*experiment"
      label: "Experiment"
      icon: "🧪"
      description: "OPRO / A-B test / benchmark / prompt tuning. Gates ADD experiment-validity checks."
      signal_words:
        zh: ["opro", "评估", "对比", "基准", "调优", "benchmark", "ab测试", "实验"]
        en: ["opro", "evaluate", "benchmark", "tune", "ab test", "experiment", "rubric", "eval-loop"]
      leads_to_handoff: "always"

    analyze:
      command: "*analyze"
      label: "Standard TAD"
      icon: "🎯"
      description: "Full TAD workflow: requirement clarification → design → handoff"
      signal_words: []
      leads_to_handoff: "always"

  detection:
    strategy: "always_confirm"
    fallback_mode: "analyze"
    signal_confidence_threshold: 2

    # Phase 3 P3.1 (2026-04-24): priority_order extended to include experiment + express.
    # *express is LAST among non-analyze on purpose — never wins a tiebreaker against
    # any specific mode (anti-AR-001 — see express_path_protocol.trigger.NOT_via_alex_suggestion).
    priority_order: ["bug", "idea", "experiment", "express", "discuss", "learn", "analyze"]
    priority_note: |
      When signal words match multiple modes equally:
      1. bug — highest priority (immediate action needed)
      2. idea — user is capturing something specific
      3. experiment — measurable A/B/eval task with rubric
      4. express — last among non-analyze; user-explicit-only entry; never wins ambiguous tiebreaker
      5. discuss — broad conversation
      6. learn — Socratic teaching
      7. analyze — fallback / default
      Ties are broken by this priority order. Final confirmation via AskUserQuestion still applies.
      ⚠️ *express never appears as Recommended (Option 1) in step3 display — even when
      signal-word detection favors it. See intent_router_protocol step3 7-mode display strategy.

# ==================== 场景工作流（增强版） ====================
scenarios:
  # 每个场景都有强制要求
  new_project:
    trigger: "没有任何代码，从零开始"

    agent_a_workflow:
      phase1_requirements:
        mandatory_subagents: ["product-expert"]
        minimum_time: "30 minutes"
        deliverable: ".tad/active/requirements_v{n}.md"
        user_confirmation: required

      phase2_architecture:
        mandatory_subagents: ["backend-architect", "api-designer"]
        deliverable: ".tad/active/architecture_v{n}.md"
        review_required: true

      phase3_handoff:
        content:
          - "完整需求文档"
          - "架构设计图"
          - "实施步骤"
          - "验收标准"
        format: ".tad/active/handoffs/project_init_{timestamp}.md"

    agent_b_workflow:
      phase1_validation:
        check: "验证handoff完整性"
        missing_info_action: "返回Agent A补充"

      phase2_execution:
        mandatory_subagents: ["parallel-coordinator", "devops-engineer"]
        parallel_tasks:
          - "项目结构创建"
          - "基础配置设置"
          - "开发环境搭建"

      phase3_testing:
        mandatory_subagents: ["test-runner"]
        coverage_requirement: ">80%"

  bug_fix:
    trigger: "发现问题需要修复"

    agent_a_workflow:
      phase1_analysis:
        mandatory_subagents: ["bug-hunter"]
        deliverable: ".tad/active/tasks/bug_analysis_{id}.md"
        must_include:
          - "问题重现步骤"
          - "根因分析"
          - "影响范围"
          - "修复方案"

    agent_b_workflow:
      phase1_reproduce:
        action: "必须先重现问题"
        failure_action: "返回Agent A重新分析"

      phase2_fix:
        mandatory_subagents: ["bug-hunter", "test-runner"]
        regression_test: required

# ==================== Research Notebook Configuration ====================
# Cross-Model Orchestration Phase 1 (2026-05-03)
# Lifecycle thresholds and fallback chains for *research-notebook skill.
# Catalog data (per-capability metadata) lives in .tad/cross-model/capabilities.yaml
research_notebook:
  # ⚠️ DEPRECATED (TAD 2.44.6, 2026-09-15) — NotebookLM 整层退役（不是升级）。
  # 本块仅保留 lifecycle thresholds；fallback 链已上移至顶层 fallback_chains.research（local_wiki → websearch）。
  # Lifecycle thresholds (days)
  dormant_after_days: 30           # active → dormant after N days without query
  archive_suggest_after_days: 90   # suggest archive after M days dormant
  max_sources_per_notebook: 20     # *add prompts curate when exceeded
  source_stale_after_days: 90      # curate flags sources older than N days

# NotebookLM removed 2.44.6; research = local_wiki → websearch
# SSOT: fallback_chains.research (top level; hoisted out of deprecated research_notebook block)
fallback_chains:
  research:
    primary: local_wiki
    secondary: websearch
  image_generation:
    primary: codex_image_gen
    secondary: manual_mermaid
  code_review:
    primary: code_reviewer
    secondary: manual_review


# ==================== Feedback Collector Configuration ====================
# 2026-06-10 — Structured human feedback for non-code AI artifacts.
# Phase 1: protocol + schema + config. Phase 2: Alex JSON reader. Phase 3: Playground integration.
feedback_collector:
  enabled: true
  version: "1.0"
  description: "Structured human feedback for non-code AI artifacts"

  artifact_types:
    - frontend_page
    - audio
    - video
    - design
    - brand
    - generic

  default_dimensions:
    frontend_page: ["text_content", "images", "buttons", "sections", "layout", "colors", "typography"]
    audio: ["segments", "tone", "pacing", "volume", "transitions"]
    video: ["timeline_slices", "subtitles", "effects", "transitions", "music"]
    design: ["components", "colors", "typography", "layout", "imagery", "spacing"]
    brand: ["name", "tagline", "color_palette", "typography", "voice_tone", "logo"]
    generic: []

  html_guidelines:
    self_contained: true
    max_embedded_media_kb: 500
    link_media_above: true
    naming: "{artifact_name}-feedback.html"

  json_schema_ref: ".tad/templates/feedback-json-schema.md"

research_track:
  enabled: true
  round_budget_default: 3
  saturation_signals: [no_new_topics, lint_stable, zero_new_locators_x2]
  critic_required: all_deep
  cross_model_challenge_tier_gate: phase_0class
  critic_independent_session: required
  landing: {process: ".tad/evidence/research", durable: "research/", published_optional: "docs/research"}

