# Ralph Loop Configuration v1.2
# TAD v2.0 - Blake Autonomous Execution
# Updated with Expert Review Feedback
# Created: 2026-01-26

$schema: "../schemas/loop-config.schema.json"

ralph_loop:
  enabled: true
  version: "1.2.0"
  description: "Iterative quality loop with expert exit conditions"

  # ==================== Layer 1: Self-Check ====================
  layer1:
    name: "Self-Check"
    description: "Fast local checks before expert review"

    # Layer 1 命令来源 = handoff §9.1（唯一权威）；本列表仅在 §9.1 未声明任何技术检查行时兜底。
    # 本仓库 package.json 无 build/lint/tsc 脚本（test 为 echo 占位）→ 空列表（schema 无 minItems，空数组合法，D3）。
    # 两者都为空 → 零命令通过，并在 completion report 的 Gate 3 小节记录一行（禁止静默跳过，D2）。
    commands: []

    # Iteration limits (clear semantics)
    limits:
      max_retries: 15  # Max Layer 1 retry count

    # Circuit Breaker - prevents infinite loops on same error
    circuit_breaker:
      enabled: true
      consecutive_same_error: 3  # Same error 3 times -> human intervention
      action: "escalate_to_human"
      message: "Layer 1 circuit breaker triggered. Same error occurred {count} times. Human intervention required."

  # ==================== Layer 2: Expert Review ====================
  layer2:
    name: "Expert Review"
    description: "Priority-grouped expert agent review"

    # Priority Groups (spec-compliance first, then code-reviewer, then others in parallel)
    priority_groups:
      group0:
        name: "Spec Compliance Gate"
        description: "Verify implementation matches handoff specification before quality review"
        parallel: false
        experts:
          - name: "spec-compliance-reviewer"
            subagent_type: "spec-compliance-reviewer"
            timeout:
              default: 180000      # 3 minutes
              small_change: 120000 # 2 minutes
              large_change: 300000 # 5 minutes
            timeout_selection: "auto"
            pass_criteria:
              severity_threshold: "partially_satisfied"
              max_issues:
                not_satisfied: 0
                partially_satisfied: 3
                satisfied: -1
            evidence_file: "{date}-spec-compliance-{task}-iter{n}.md"

      group1:
        name: "Code Quality Gate"
        description: "Must pass before other experts run"
        parallel: false
        experts:
          - name: "code-reviewer"
            subagent_type: "code-reviewer"
            # Tiered timeout based on change size (v1.2 update)
            timeout:
              default: 600000      # 10 minutes - standard
              small_change: 180000 # 3 minutes - single file fix
              large_change: 900000 # 15 minutes - 50+ files
            timeout_selection: "auto"  # auto-detect based on file count
            pass_criteria:
              severity_threshold: "P2"  # P0 and P1 are blocking
              max_issues:
                P0: 0
                P1: 0
                P2: 10  # Allow up to 10 P2 issues
                P3: -1  # Unlimited
            evidence_file: "{date}-code-review-{task}-iter{n}.md"

      group2:
        name: "Verification Experts"
        description: "Run in parallel after Group 0 and Group 1 pass"
        parallel: true
        experts:
          - name: "test-runner"
            subagent_type: "test-runner"
            # Tiered timeout based on test type (v1.2 update)
            timeout:
              default: 600000       # 10 minutes - standard
              unit_only: 180000     # 3 minutes - unit tests only
              with_integration: 600000  # 10 minutes - unit + integration
              with_e2e: 1200000     # 20 minutes - includes E2E tests
            timeout_selection: "auto"  # auto-detect based on test config
            required: true
            pass_criteria:
              test_pass_rate: 100
              coverage_minimum: 70
            evidence_file: "{date}-testing-review-{task}-iter{n}.md"

          - name: "security-auditor"
            subagent_type: "security-auditor"
            timeout: 300000  # 5 minutes - sufficient for pattern scanning
            required: false  # Conditional
            trigger_pattern: "auth|token|password|credential|api.*key|encrypt|decrypt|session|cookie|sql|query|upload|file|exec|eval"
            pass_criteria:
              severity_threshold: "medium"  # critical and high are blocking
            evidence_file: "{date}-security-review-{task}-iter{n}.md"

          - name: "performance-optimizer"
            subagent_type: "performance-optimizer"
            timeout: 300000  # 5 minutes - sufficient for complexity analysis
            required: false  # Conditional
            trigger_pattern: "database|query|cache|batch|loop|sort|search|O\\(n"
            pass_criteria:
              blocking_patterns:
                - "O(n^3) without justification"
                - "O(n^2) in hot path without justification"
                - "Unbounded recursion"
                - "Obvious memory leak"
            evidence_file: "{date}-performance-review-{task}-iter{n}.md"

    # Layer 2 specific limits
    limits:
      max_rounds: 3  # Total STARTED rounds including R1; same task/lineage, never R4

    # Execution guards live in Blake SKILL 3_layer2_loop (prompt protocol, not runtime engine).
    # AFTER Layer 1 PASS freeze input; BEFORE first dispatch increment layer2_rounds and
    # current_iteration once, persist STARTED + round/input manifest. No failure-time increment.
    # Groups 0 -> 1 -> 2 share one round. Earlier FAIL leaves later groups NOT_RUN.
    # Any R1/R2/R3 all applicable groups satisfied on same final input -> COMPLETED.
    # R3 STARTED/INTERRUPTED same-input unfinished calls may resume without new count.
    # R3 CLOSED/FAILED/unjudgeable -> ESCALATED_TO_ALEX; stop repairs/re-review, no R4.
    # Original raw severity/counts retained; thresholds count independently recognized
    # valid unresolved task findings, not Blake's closure proposals. Unmet AC stays unmet.
    # Standing risk veto before dispatch/report/error/completion: unresolved serious
    # out-of-scope safety/delivery risk -> BLOCKED_RISK for Alex/human, overriding COMPLETED.
    # Escalation threshold
    escalation:
      enabled: true
      threshold: 3  # 3 failed rounds on same issue category -> escalate
      action: "escalate_to_alex"
      message: "Layer 2 escalation: {escalation_reason}. Budget-exhaustion branch: {layer2_rounds} started rounds including R1, possibly different failure categories; preserve input/open findings/NOT_RUN, stop repair/re-review, no R4, return to Alex. Same-category branch only when its threshold fired: {category} failed {count} times; preserve evidence and return to Alex."

  # ==================== Global Limits (Clear Semantics) ====================
  limits:
    description: "Total limits for entire Ralph Loop execution"

    # Iteration counting: Layer 1 retry = 1, STARTED Layer 2 round = 1 (before dispatch)
    total_iterations: 30  # Combined Layer 1 + Layer 2 count
    timeout_minutes: 120  # Global timeout (2 hours)
    per_iteration_timeout: 15  # Max time per single iteration (minutes)

    abort_conditions:
      - condition: "total_iterations >= 30"
        action: "abort"
        message: "Ralph Loop exceeded {limit} total iterations. Human intervention required."

      - condition: "timeout_minutes >= 120"
        action: "abort"
        message: "Ralph Loop exceeded {limit} minute timeout. Human intervention required."

      - condition: "layer1.circuit_breaker.triggered"
        action: "abort"
        message: "Layer 1 circuit breaker triggered. Human intervention required."

      - condition: "layer2.escalation.triggered"
        action: "escalate"
        message: "Design-level issue detected. Escalating to Alex."

  # ==================== State Persistence ====================
  state_persistence:
    enabled: true
    description: "Persist loop state for crash recovery"

    state_file: ".tad/evidence/ralph-loops/{task_id}_state.yaml"
    checkpoint_frequency: "after_each_layer"  # Schema-compatible; plus mandatory checkpoints below
    # Also BEFORE round dispatch, after each reviewer/group/round, on error and terminal state.
    # State is authoritative; summary/session-state are derived pointers, never smaller budgets.

    state_schema:
      current_iteration: 0
      layer1_retries: 0
      layer2_rounds: 0  # Started rounds including R1; 0..3 for new tasks, not legacy failures
      review_brakes_version: 1
      task_identity:
        handoff_path: null
        handoff_digest: null
        baseline_ref: null  # starting HEAD + task-start byte manifest
        budget_origin: null
      layer2_status: NOT_STARTED
      active_round: null
      round_history: []  # number/input_id/input_manifest/status, append STARTED BEFORE dispatch
      group_progress: {}  # EACH expert status/report/last_reviewed_input; group PASS only when complete
      findings_ref: null  # immutable originals + stable ID/proposal/independent decision/final ledger
      escalation_reason: null
      last_completed_layer: null  # "layer1" or "layer2"
      last_error_category: null
      consecutive_same_error: 0
      started_at: null
      last_checkpoint_at: null

    recovery:
      enabled: true
      on_resume: "continue_from_last_checkpoint"
      stale_threshold_minutes: 30  # Reload context/revalidate input, never clear budget/history
      # Missing/legacy state: reconstruct every started round/input/coverage only from complete
      # dispatch/report proof, preserve old state + derivation; ambiguous -> BLOCKED_STATE.
      # Legacy layer2_rounds counted failures: no direct reuse/fixed +1. Proven never dispatched
      # permits 0; used >=3 unfinished -> Alex; historical >3 preserved, never clamped.
      # *ralph-reset/fresh reruns Layer 1/context only. Compact/stale/crash/new ID cannot reset
      # same baseline/handoff/budget_origin. New scope/budget needs explicit human authority.
      # Same-input unfinished calls resume without increment/refund; changed source/handoff/
      # reviewer contract closes INTERRUPTED, Layer 1 -> next budgeted round or Alex.
      # input_id: handoff + baseline + task delta bytes/deletions/renames + reviewer contract
      # + executable AC scripts. Save replayable diff/content manifest, not floating HEAD.
      # Continuous state/reports/ledger/summary/final/run logs excluded from input hash;
      # label outputs with input_id. Read-only consumer observations carry digest/edge proof;
      # relevant changes invalidate old conclusions. Old PASS never proves a new input.

  # ==================== Evidence and Logging ====================
  evidence:
    directory: ".tad/evidence/ralph-loops"

    files:
      state: "{task_id}_state.yaml"  # Current loop state
      summary: "{task_id}_summary.md"  # Aggregated summary
      iterations: "{timestamp}_{task_id}_iter_{n}.md"  # Per-iteration log

    retention_days: 30

    # Summary file format
    summary_format: |
      # Ralph Loop Summary: {task_id}

      ## Execution Overview
      - Total Iterations: {total_iterations}
      - Layer 1 Retries: {layer1_retries}
      - Layer 2 Started Rounds (includes R1): {layer2_rounds}
      - Task identity / budget origin / baseline: {task_identity}
      - Final input / manifest: {input_id} / {input_manifest}
      - Escalation reason (if any): {escalation_reason}
      - Final Status: {status}
      - Duration: {duration}

      ## Layer 1 Results
      | Iteration | Build | Test | Lint | TSC | Result |
      |-----------|-------|------|------|-----|--------|
      {layer1_table}

      ## Layer 2 Results
      | Round | spec-compliance | code-reviewer | test-runner | security | performance | Result |
      |-------|-----------------|---------------|-------------|----------|-------------|--------|
      {layer2_table}

      ## Input, Coverage and Dispositions
      {round_input_history}
      {per_expert_last_reviewed_input_and_NOT_RUN}
      {raw_counts_and_valid_blocking_counts_with_IDs}
      {independent_disposition_ledger_and_reopen_links}
      COMPLETED requires all applicable groups independently satisfied on final input;
      ESCALATED_TO_ALEX/BLOCKED_STATE/BLOCKED_RISK/ABORTED are not clean completion.

      ## Evidence Files
      - Final spec compliance: {spec_compliance_link}
      - Final code review: {code_review_link}
      - Final test report: {test_report_link}
      - [Additional files...]

  # ==================== Rollback Strategy ====================
  rollback:
    enabled: true
    on_abort:
      action: "git stash push -m 'Ralph Loop aborted: {task_id} iteration {n}'"
      preserve_evidence: true
      notification: |
        Ralph Loop aborted at iteration {n}.
        Partial changes stashed: {stash_ref}
        Evidence preserved at: {evidence_path}
        Human action required: Review and decide next steps.
