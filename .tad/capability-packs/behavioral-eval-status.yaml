# Behavioral Eval Status — capability pack verification tracker
# ---------------------------------------------------------------------------
# WHY a SIDE-FILE (not a field in pack-registry.yaml):
#   pack-registry.yaml is AUTO-GENERATED by scan-packs.sh (`cat > $OUTPUT` —
#   full regen from CAPABILITY.md/SKILL.md frontmatter). Any `behaviorally_verified`
#   field added to the registry would be CLOBBERED on the next scan. This side-file
#   is user/conductor-owned state and survives registry regeneration.
#   (Pattern: architecture.md "Pack registry desync fix + drift-check" / Registry
#    field design — separate derived scan data from persisted decision state.)
#
# STATUS SEMANTICS:
#   pending     — fixture(s) exist; NO passing behavioral eval recorded yet.
#                 Default for every installed capability pack. Count of fixtures
#                 is NOT verification (count ≠ signal — YOLO audit "validation theater").
#   verified-discriminative — a pack-loaded sub-agent ran a fixture's Input
#                 Scenario, the captured output PASSED pack-eval-runner.sh
#                 (actual ≥ min_marker_count) AND the control run without the
#                 pack FAILED the same gate (clean delta). This is a
#                 single-fixture EXISTENCE proof only: it shows the pack can
#                 drive discriminative behavior on that fixture, nothing more.
#                 ONLY the Conductor flips pending → verified-discriminative
#                 after a real eval run (AC5.6, driven in Y6 — NOT by Blake,
#                 NOT by fixture authoring). (Renamed from `verified` on
#                 2026-10-31 per TICKET-20261031-pack-triage: the old bare word
#                 overstated the evidence grade.)
#   verified-in-use — RESERVED higher grade (not produced in this phase):
#                 requires real-task replay evidence plus trigger-rate data
#                 from production use, not fixture runs.
#   no-discriminative-power — the pack WAS behaviorally evaluated and the
#                 control run (without the pack) passed the same gate: no
#                 clean delta, so the fixture does not discriminate. The pack
#                 stays registered; re-verification requires first tightening
#                 the fixture's discriminative markers to pack-unique terms.
#   no-fixture  — pack is registered in .tad/capability-packs/ but is NOT installed
#                 as a .agents/skills/<pack>/ skill, so it has no examples/ fixture.
#   deregistered — pack removed from the registry scan surface (source moved
#                 to .tad/capability-packs-retired/, bytes preserved); the row
#                 is kept here as history, never deleted.
#
# CONTRACT: pack-eval-runner.sh --all <outputs-dir> produces the PASS/FAIL data that
#   justifies a flip. Never hand-set `verified-discriminative` — only a passing runner result does.
# ---------------------------------------------------------------------------

